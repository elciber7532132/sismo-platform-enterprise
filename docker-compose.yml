services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sismo_platform}
      POSTGRES_USER: ${POSTGRES_USER:-sismo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sismo_app} -d ${POSTGRES_DB:-sismo_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./services/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://sismo_app:change-this-local-password@db:5432/sismo_platform}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      AUTO_ALERT_MIN_MAGNITUDE: ${AUTO_ALERT_MIN_MAGNITUDE:-5.0}
      AUTO_SYNC_ENABLED: ${AUTO_SYNC_ENABLED:-true}
      AUTO_SYNC_INTERVAL_SECONDS: ${AUTO_SYNC_INTERVAL_SECONDS:-300}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build: ./apps/web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
